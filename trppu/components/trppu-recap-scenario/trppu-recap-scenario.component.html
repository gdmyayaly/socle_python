<div class="recap-container">
  <div class="scenario-name-block">
    <mat-label>Scénario :</mat-label>
    <mat-form-field class="scenario-name-input" appearance="outline">
      <input matInput maxlength="20" [value]="scenarioName" [(ngModel)]="editedName" (focusout)="saveName()" placeholder="Nom du scénario" />
      <mat-hint align="end">{{ editedName.length > 0 ? editedName.length : scenarioName.length }} / 20</mat-hint>
    </mat-form-field>
  </div>
  
  <div class="scenario-status-block">
    <mat-label>Statut :</mat-label>
    <mat-form-field appearance="outline" class="status-select">
      <mat-select 
        [value]="scenario ? scenario.statut : null" 
        (selectionChange)="changeStatus($event.value)"
        [disabled]="isStatusChangeDisabled() || isChangingStatus">
        <mat-option *ngFor="let status of editableStatuses" [value]="status">
          {{ getStatusLabel(status) }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    
    <!-- Message when traffic calculation is in progress -->
    <div *ngIf="isTraficsCalculInProgress()" class="status-disabled-message">
      Calcul des trafics est en cours !
    </div>
  </div>
</div>
