<div class="param-site">
  <app-trppu-select-site
    [scenario]="selectedScenario"
    (siteSelected)="onSiteSelected($event)">
  </app-trppu-select-site>
</div>

<div class="overlay-wrapper">
  <div class="overlay-block" *ngIf="!selectedSite">
    <span>Sélectionnez un site pour accéder aux paramètres.</span>
  </div>

  <div class="param-sections" [class.disabled-content]="!selectedSite">
    <div class="overlay-block" *ngIf="!selectedScenario">
      <span>Sélectionnez un scénario pour accéder aux périodes à neutraliser.</span>
    </div>
 <app-trppu-periode-neutraliser
  [class.disabled-content]="!selectedScenario"
  [scenario]="selectedScenario"
  (periodesChange)="onPeriodesNeutraliseesChange($event)">
 </app-trppu-periode-neutraliser>

  <div *ngIf="selectedScenario"> 
  <app-trppu-variation-previsionnelle
  [class.disabled-content]="!selectedScenario"
    [idScenario]="selectedScenario?.id_scenario"
    [readonly]="selectedScenario?.est_fige">
  </app-trppu-variation-previsionnelle>
  </div>
