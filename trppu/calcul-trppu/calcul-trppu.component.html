<div class="site-scenario-row">
  <div class="site-col">
    <app-trppu-select-site 
      [scenario]="selectedScenario"
      (siteSelected)="onSiteSelected($event)">
    </app-trppu-select-site>
  </div>
  <div class="scenario-col">
    <app-trppu-scenario-list
      #scenarioList
      [site]="selectedSite"
      [siteId]="selectedSite ? selectedSite.codeRoc : null"
      (editScenario)="onEditScenario($event)"
      (removeScenario)="onRemoveScenario($event)"
      (addScenario)="onAddScenario()">
    </app-trppu-scenario-list>
  </div>
</div>


<div class="overlay-wrapper">
  <div class="overlay-block" *ngIf="!selectedScenario">
    <span>Sélectionnez un scénario pour editer le libellé et le statut</span>
  </div>
  <app-trppu-recap-scenario
    [scenario]="selectedScenario"
    (scenarioNameUpdated)="scenarioList.refreshScenarios()">
  </app-trppu-recap-scenario>
</div>

<div class="overlay-wrapper">
  <div class="overlay-block" *ngIf="!selectedScenario">
    <span>Sélectionnez un scénario pour accéder à la période.</span>
  </div>
  <app-trppu-periode-scenario
    [class.disabled-content]="!selectedScenario"
    [dateMinLimit]="'2015-01-01'"
    [dateMin]="'2015-01-01'"
    [dateMax]="'2030-12-31'"
    [dateMaxLimit]="'2030-12-31'"
    [idRh]="idRh"
    [scenarioId]="selectedScenario ? (selectedScenario.id_scenario ?? $any(selectedScenario).id_scenario ?? null) : null"
    [periode]="currentPeriode"
    [datePivot]="selectedScenario ? selectedScenario.dt_mise_en_oeuvre : null"
    [joursParSemaine]="currentJoursParSemaine"
    (periodeChange)="onPeriodeChange($event)"
    (periodeValidated)="onPeriodeValidated($event)"
    (refreshTraficsRequested)="onRefreshTraficsRequested()"
    (refreshNeeded)="onRefreshNeeded()"
    (dirtyChange)="periodeHasChanges = $event">
  </app-trppu-periode-scenario>
</div>

<div class="overlay-wrapper">
  <div class="overlay-block" *ngIf="!selectedScenario">
    <span>Sélectionnez un scénario pour afficher les trafics calculés.</span>
  </div>
  <app-trppu-trafics-calculer
    [class.disabled-content]="!selectedScenario"
    [scenarioId]="selectedScenario ? (selectedScenario.id_scenario ?? $any(selectedScenario).id_scenario ?? null) : null"
    [coRegate]="selectedSite ? selectedSite.codeRegate : null"
    [dateDebut]="currentPeriode?.dateDebut ?? null"
    [dateFin]="currentPeriode?.dateFin ?? null"
    [datePivot]="currentPeriode?.datePivot ?? null"
    [joursOuvrables]="selectedScenario?.nb_jours_ouvrables ?? 0"
    [joursParSemaine]="currentJoursParSemaine"
    (periodeValidated)="onPeriodeValidated($event)"
    (joursParSemaineChange)="onJoursParSemaineChange($event)">
  </app-trppu-trafics-calculer>
</div>
